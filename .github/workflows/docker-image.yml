name: Container build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --tag stocktake-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag stocktake-frontend:ci ./frontend
