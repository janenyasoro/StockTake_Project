services:
  - type: web
    name: stocktake-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && python manage.py seed_catalogue --if-empty && gunicorn StockTake.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: stocktake-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://stockpulse-backend-2iy4.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
