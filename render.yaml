services:
  - type: web
    name: stockpulse-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn StockPulse.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
