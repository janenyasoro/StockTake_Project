version: '3.8'

services:
  # Backend Service (Django)
  backend:
    build:
      context: ./Backend  # Changed from 'backend' to 'Backend' (capital B)
      dockerfile: Dockerfile
    container_name: stockpulse-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Backend:/app
      - /app/__pycache__/
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/stockpulse
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
      - FIREBASE_CREDENTIALS_PATH=/app/serviceAccountKey.json
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    depends_on:
      - db
      - redis
    networks:
      - stockpulse-network

  # Frontend Service (React)
  frontend:
    build:
      context: ./Frontend  # Assuming you have a Frontend directory
      dockerfile: Dockerfile
    container_name: stockpulse-frontend
    command: npm start
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_FIREBASE_API_KEY=${REACT_APP_FIREBASE_API_KEY}
      - REACT_APP_FIREBASE_AUTH_DOMAIN=${REACT_APP_FIREBASE_AUTH_DOMAIN}
      - REACT_APP_FIREBASE_PROJECT_ID=${REACT_APP_FIREBASE_PROJECT_ID}
      - REACT_APP_FIREBASE_STORAGE_BUCKET=${REACT_APP_FIREBASE_STORAGE_BUCKET}
      - REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${REACT_APP_FIREBASE_MESSAGING_SENDER_ID}
      - REACT_APP_FIREBASE_APP_ID=${REACT_APP_FIREBASE_APP_ID}
      - REACT_APP_FIREBASE_MEASUREMENT_ID=${REACT_APP_FIREBASE_MEASUREMENT_ID}
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - stockpulse-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: stockpulse-db
    environment:
      - POSTGRES_DB=stockpulse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stockpulse-network

  # Redis Cache (optional, for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: stockpulse-redis
    ports:
      - "6379:6379"
    networks:
      - stockpulse-network

  # Nginx (optional, for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: stockpulse-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - stockpulse-network

volumes:
  postgres_data:

networks:
  stockpulse-network:
    driver: bridge