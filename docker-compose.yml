services:
  backend:
    build: ./backend
    image: your-username/stockpulse:backend
    container_name: stockpulse-backend
    ports:
      - "8000:8000"
    # Makes the root .env (Firebase credentials and other local secrets)
    # available inside the container. This file is intentionally not tracked.
    env_file:
      - ./.env
    environment:
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      # Do not use backend/.env here: its credentials may refer to a different
      # database. These values match the local `db` service below.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/stockpulse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - db
      - redis
    networks:
      - stockpulse-network

  frontend:
    build: ./frontend
    image: your-username/stockpulse:frontend
    container_name: stockpulse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - stockpulse-network

  db:
    image: postgres:15-alpine
    container_name: stockpulse-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=stockpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockpulse-network

  redis:
    image: redis:alpine
    container_name: stockpulse-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - stockpulse-network

volumes:
  postgres_data:

networks:
  stockpulse-network:
    driver: bridge
